aid: wag
name: Wag!
description: >-
  Wag! is a US pet-care marketplace that connects dog and pet owners with local,
  background-checked caregivers for on-demand and scheduled dog walking, drop-in
  visits, pet sitting, boarding, daycare, and 24/7 vet chat. Operating across
  5,300+ cities in all 50 states, the platform has completed more than 16 million
  services and is delivered primarily through its iOS and Android consumer apps.
  Wag! (Wag Labs, Inc.) is backed by Battery Ventures, Bullpen Capital, and
  General Catalyst. As of July 2026 Wag! exposes no public developer API or
  documented partner API; its production API hosts (prod-*-api.wagwalking.com)
  are internal mobile-app backends. This profile captures the company's public
  security and identity surface pending any future developer program.
